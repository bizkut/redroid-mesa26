name: Verify qualified ReDroid image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify published image on GHCR
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted publication manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate publication metadata
        id: metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path("prebuilt-image.json").read_text())
          expected = {
              "qualified_source_image": r"[a-z0-9._/-]+:[a-z0-9._-]+",
              "qualified_source_image_id": r"sha256:[0-9a-f]{64}",
              "qualified_rootfs_sha256": r"[0-9a-f]{64}",
              "registry": r"ghcr\.io/[a-z0-9._/-]+",
              "release_tag": r"v[0-9]+\.[0-9]+\.[0-9]+",
              "channel_tag": r"[a-z0-9._-]+",
              "immutable_tag": r"image-[0-9a-f]{12}",
              "registry_digest": r"sha256:[0-9a-f]{64}",
              "registry_platform_digest": r"sha256:[0-9a-f]{64}",
              "registry_attestation_digest": r"sha256:[0-9a-f]{64}",
          }
          if data.get("schema") != 1 or data.get("platform") != "linux/amd64":
              raise SystemExit("unsupported prebuilt image manifest")
          for key, pattern in expected.items():
              value = data.get(key)
              if not isinstance(value, str) or re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"invalid {key}")
          if data["registry"] != "ghcr.io/bizkut/redroid-mesa26":
              raise SystemExit("unexpected publication registry")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key in expected:
                  print(f"{key}={data[key]}", file=output)
          PY

      - name: Verify every public tag and manifest digest
        env:
          REGISTRY: ${{ steps.metadata.outputs.registry }}
          CHANNEL_TAG: ${{ steps.metadata.outputs.channel_tag }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
          EXPECTED_INDEX: ${{ steps.metadata.outputs.registry_digest }}
          EXPECTED_PLATFORM: ${{ steps.metadata.outputs.registry_platform_digest }}
          EXPECTED_ATTESTATION: ${{ steps.metadata.outputs.registry_attestation_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          registry = os.environ["REGISTRY"]
          expected_index = os.environ["EXPECTED_INDEX"]
          expected_platform = os.environ["EXPECTED_PLATFORM"]
          expected_attestation = os.environ["EXPECTED_ATTESTATION"]
          tags = (
              os.environ["CHANNEL_TAG"],
              os.environ["RELEASE_TAG"],
              os.environ["IMMUTABLE_TAG"],
          )
          for tag in tags:
              reference = f"{registry}:{tag}"
              result = subprocess.run(
                  [
                      "docker", "buildx", "imagetools", "inspect", reference,
                      "--format", "{{json .Manifest}}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              manifest = json.loads(result.stdout)
              if manifest.get("digest") != expected_index:
                  raise SystemExit(f"{reference}: OCI index digest mismatch")
              children = manifest.get("manifests")
              if not isinstance(children, list):
                  raise SystemExit(f"{reference}: missing child manifests")
              platforms = [
                  child for child in children
                  if child.get("platform") == {"architecture": "amd64", "os": "linux"}
              ]
              attestations = [
                  child for child in children
                  if child.get("annotations", {}).get("vnd.docker.reference.type")
                  == "attestation-manifest"
              ]
              if len(platforms) != 1 or platforms[0].get("digest") != expected_platform:
                  raise SystemExit(f"{reference}: Linux/amd64 manifest mismatch")
              if len(attestations) != 1 or attestations[0].get("digest") != expected_attestation:
                  raise SystemExit(f"{reference}: attestation manifest mismatch")
              if (
                  attestations[0].get("annotations", {}).get("vnd.docker.reference.digest")
                  != expected_platform
              ):
                  raise SystemExit(f"{reference}: attestation subject mismatch")
              print(f"verified {reference}@{expected_index}")
          PY

      - name: Report verified image
        env:
          REGISTRY: ${{ steps.metadata.outputs.registry }}
          EXPECTED_INDEX: ${{ steps.metadata.outputs.registry_digest }}
        run: |
          {
            echo '## Verified ReDroid image'
            echo
            echo '```text'
            echo "$REGISTRY@$EXPECTED_INDEX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
